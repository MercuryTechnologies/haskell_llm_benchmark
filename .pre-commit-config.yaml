repos:
  - repo: local
    hooks:
      - id: no-eap
        name: Block -eap strings
        entry: bash -c '! grep -rn "\-eap" "$@"' --
        language: system
        types: [text]
        exclude: '\.pre-commit-config\.yaml$'
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black --line-length 100 --preview
        language: system
        types: [python]
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: ["--show-source"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        args: ["--skip", "aider/website/docs/languages.md"]
        additional_dependencies:
          - tomli
